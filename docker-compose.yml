version: '3.8'

services:
  stock-analyzer:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FLASK_DEBUG=0
      - LOG_LEVEL=INFO
      - TZ=Asia/Taipei
    volumes:
      - stock_data:/app/data
      - stock_results:/app/results
      - stock_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/status')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  stock_data:
  stock_results:
  stock_logs:
